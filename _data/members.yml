# People shown on /my-group/ (rendered by _pages/my-group.md).
#
# Add a person as one entry under "current", "friends" (students advised by
# other faculty who take part in the group), "on_leave" or "alumni"; each
# section lists people in the order given here. Fields:
#   name     full name as it should appear
#   role     position (e.g. "PhD student, Global Health Program")
#   details  optional second line (degree and year, current position, topic)
#   photo    optional file name under images/ (e.g. "members/jane-doe.jpg",
#            square, about 600x600 px); leave "" to show the placeholder
#
# Optional fields that turn a card into a clickable popup with more details:
#   chinese_name    shown next to the name in the popup
#   bio             one short paragraph written by the member
#   hobbies         free text
#   favorite_food   free text
#   favorite_quote  the quote without quotation marks
#   quote_source    optional attribution for the quote
#
# Source: lab members sheet for semester 115-1 (autumn 2026). Emails are kept
# out of this file on purpose, since the page is public.
# The "1st year" / "2nd year" labels in the roles refer to that semester and
# need updating each autumn.

